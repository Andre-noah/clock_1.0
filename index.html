<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Flip Clock">
<meta name="mobile-web-app-capable" content="yes">
<title>Flip Clock</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    color-scheme: dark;
    --bg: #000000;
    --fg: #f2f2f2;
    --dim: #4a4a4a;
    --card: #141414;
    --seam: #000000;
  }
  *{ box-sizing: border-box; }
  html, body{
    height: 100%;
    width: 100%;
    margin: 0;
    background: var(--bg);
    overflow: hidden;
  }
  body{
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Force a landscape layout even if the OS keeps the device/browser
     in portrait (orientation lock only works once in true fullscreen
     on some browsers, so this CSS fallback guarantees horizontal
     display everywhere, including a plain browser tab). */
  @media screen and (orientation: portrait){
    html{
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: top left;
      position: absolute;
      top: 0;
      left: 100%;
      overflow: hidden;
    }
  }

  .clock{
    display: flex;
    align-items: center;
    gap: clamp(8px, 2vw, 22px);
  }

  .colon{
    color: var(--dim);
    font-size: clamp(24px, 7vw, 64px);
    font-weight: 300;
    line-height: 1;
    animation: blink 2s steps(1) infinite;
    padding-bottom: 4px;
  }
  @keyframes blink{
    0%, 49%{ opacity: 1; }
    50%, 100%{ opacity: 0.15; }
  }

  .unit{
    display: flex;
    gap: clamp(4px, 1.2vw, 10px);
  }

  .digit{
    position: relative;
    width: clamp(70px, 20vw, 160px);
    height: clamp(100px, 29vw, 230px);
    perspective: 400px;
  }

  .card-static{
    position: absolute;
    inset: 0;
    border-radius: clamp(6px, 1.2vw, 12px);
    background: var(--card);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.03);
    overflow: hidden;
  }

  .card-static::after{
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 2px;
    background: var(--seam);
    transform: translateY(-1px);
    z-index: 5;
  }

  .num{
    position: absolute;
    left: 0; right: 0;
    height: 50%;
    overflow: hidden;
    font-size: clamp(60px, 18vw, 150px);
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -2px;
  }
  .num span{
    position: absolute;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .num.top{ top: 0; }
  .num.top span{ top: 0; height: 200%; }

  .num.bottom{ bottom: 0; }
  .num.bottom span{ bottom: 0; height: 200%; }

  /* flipping leaf */
  .leaf{
    position: absolute;
    left: 0; right: 0;
    height: 50%;
    overflow: hidden;
    background: var(--card);
    font-size: clamp(60px, 18vw, 150px);
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -2px;
    z-index: 10;
    transform-style: preserve-3d;
    backface-visibility: hidden;
  }
  .leaf span{
    position: absolute;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .leaf.front{
    top: 0;
    border-radius: clamp(6px, 1.2vw, 12px) clamp(6px, 1.2vw, 12px) 0 0;
    transform-origin: bottom;
  }
  .leaf.front span{ top: 0; height: 200%; }

  .leaf.back{
    bottom: 0;
    border-radius: 0 0 clamp(6px, 1.2vw, 12px) clamp(6px, 1.2vw, 12px);
    transform-origin: top;
    transform: rotateX(90deg);
  }
  .leaf.back span{ bottom: 0; height: 200%; }

  @keyframes flipFront{
    0%{ transform: rotateX(0deg); }
    100%{ transform: rotateX(-90deg); }
  }
  @keyframes flipBack{
    0%{ transform: rotateX(90deg); }
    100%{ transform: rotateX(0deg); }
  }
  .flip-front{ animation: flipFront 0.3s cubic-bezier(.37,0,.63,1) forwards; }
  .flip-back{ animation: flipBack 0.3s cubic-bezier(.37,0,.63,1) 0.3s forwards; }

  .secondsbar{
    position: fixed;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    color: var(--dim);
    font-size: clamp(11px, 2.2vw, 15px);
    letter-spacing: 2px;
    font-weight: 400;
  }
</style>
</head>
<body>

<div class="clock" id="clock"></div>
<div class="secondsbar" id="secondsLabel"></div>

<script src="script.js"></script>
</body>
</html>
